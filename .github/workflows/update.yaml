name: Daily Filter List Updater

on:
  schedule:
    # Runs at 02:00 UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch: 
    # This allows you to run it manually from the GitHub Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    # Required to allow the bot to commit back to your repository
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run filter compilation script
        run: python update_filters.py

      - name: Commit and Push changes
        run: |
          # Configure Git for the Actions bot
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage the new combined file and raw filters
          git add combined_filters.txt
          
          # Only commit if there are actual changes
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update filter lists [skip ci]"
          
          # Push back to the main branch
          git push